[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mqtt-helper-graystorm"
version = "1.3.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "paho-mqtt>=2.1.0",
]
authors = [{ name = "Jeff Culverhouse" }]
license = { text = "MIT" }

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["mqtt_helper*"]

[dependency-groups]
dev = [
    "ruff>=0.16.3",
    "pytest>=9.0.3",
    "pytest-asyncio>=0.24",
    "pip-audit>=2.10.1",
]

[tool.uv]
# Force patched floors for transitive deps that pip-audit flags but no
# direct dependency requires (only reachable via dev tooling here).
constraint-dependencies = [
    "click>=8.3.3",  # PYSEC-2026-2132
]

[tool.ruff]
# Exclude a variety of commonly ignored directories.
exclude = [
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".git-rewrite",
    ".hg",
    ".ipynb_checkpoints",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".pyenv",
    ".pytest_cache",
    ".pytype",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    ".vscode",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "site-packages",
    "venv",
]

line-length = 160
indent-width = 4

# Assume Python 3.13
target-version = "py313"

[tool.ruff.lint]
# Ride ruff's defaults (same as the *2mqtt services) with a narrow ignore
# list. These three fire throughout the reconnect/publish paths, where
# swallowing a broad exception is deliberate: a helper must never take the
# calling service down.
ignore = [
    "BLE001",  # blind `except Exception` — intentional at MQTT callback boundaries
    "S110",    # try/except/pass — deliberate best-effort cleanup
    "TRY401",  # redundant exception object in logging.exception()
]

[tool.pytest.ini_options]
pythonpath = "src"
asyncio_mode = "auto"
addopts = "--quiet"
