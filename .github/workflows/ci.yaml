name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    # .python-version pins 3.14, and uv honours it over whatever
    # setup-python put on PATH — be explicit so the two agree.
    env:
      UV_PYTHON: "3.13"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Set up uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: "latest"

      # `uv sync --frozen` installs straight from the lockfile without
      # validating it against pyproject.toml, so drift would silently test the
      # old pinned versions. Fail loudly instead.
      - name: Lockfile up to date
        run: uv lock --check

      - name: Install project (dev)
        run: uv sync --frozen --dev

      - name: Ruff
        run: |
          uv run ruff --version
          uv run ruff check .

      - name: Format (ruff)
        run: uv run ruff format --check --diff .

  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Matches requires-python = ">=3.12"; this library backs all four
        # *2mqtt services, so it has to hold across every version they run.
        python-version: ["3.12", "3.13", "3.14"]
    # Without this uv resolves the interpreter from .python-version (3.14)
    # and every matrix leg would silently run the same version.
    env:
      UV_PYTHON: ${{ matrix.python-version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: "latest"

      - name: Install project (dev)
        run: uv sync --frozen --dev

      - name: Pytest
        run: |
          uv run python -V
          uv run pytest
